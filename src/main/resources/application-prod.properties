server.port=${PORT:8080}
spring.application.name=chessgame

# Banco H2 em memória (igual ao Puzzle/Forecast)
spring.datasource.url=jdbc:h2:mem:chessdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Desative o console H2 em produção
spring.h2.console.enabled=false

# Recursos estáticos (HTML, CSS, imagens)
spring.web.resources.static-locations=classpath:/static/,classpath:/public/

# OpenAI (será injetado via variável de ambiente no Render)
openai.api.key=${OPENAI_API_KEY}

# Encoding explícito (ajuda a evitar esse erro)
project.build.sourceEncoding=UTF-8
project.reporting.outputEncoding=UTF-8