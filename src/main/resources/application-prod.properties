server.port=${PORT:8080}
spring.application.name=chessgame

# ================== BANCO H2 EM MEMÓRIA (igual no Puzzle) ==================
spring.datasource.url=jdbc:h2:mem:chessdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 console desativado em produção (pode deixar true se quiser testar)
spring.h2.console.enabled=false

# Recursos estáticos (index.html, style.css, img/)
spring.web.resources.static-locations=classpath:/static/,classpath:/public/

# OpenAI (se estiver usando stockfish ou o3-mini)
openai.api.key=${OPENAI_API_KEY}

# Opcional: menos logs em produção
logging.level.org.springframework=INFO
logging.level.com.chess.chessgame=INFO